name: run main.py

on:
  schedule:
    - cron: '0 10 * * 1-5' # At 10:00 UTC on weekdays since source updates once per weekday between 2-10
  workflow_dispatch:  # Allows manual triggering of the workflow

permissions:
  contents: write

concurrency:
  group: update-quotes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: checkout repo content
        uses: actions/checkout@v7

      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x' # use latest python version
          cache: pip
          
      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: execute py script 
        env:
          PYTHONUNBUFFERED: "1"
        run: python main.py
          
      - name: commit files
        run: |
          git config --local user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git config --local user.name "${GITHUB_ACTOR}"
          git add AchmeaOpkomendeMarkten.json
          git diff --cached --quiet || git commit -m "updated quotes $(date -u +%F)"
          
      - name: push changes
        run: git push origin HEAD:master
